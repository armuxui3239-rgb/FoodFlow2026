# coturn — TURN/STUN สำหรับ LiveKit (รอเซิร์ฟเวอร์จริง)
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
realm=foodthunder.example
# ใบรับรอง TLS จริงจำเป็น — ห้ามใช้ self-signed ใน production
cert=/etc/letsencrypt/live/${TURN_DOMAIN}/fullchain.pem
pkey=/etc/letsencrypt/live/${TURN_DOMAIN}/privkey.pem
min-port=50000
max-port=50100
log-file=stdout
no-cli
