# ค่าเริ่มต้น LiveKit self-host — แพตช์ v3.1 ข้อ 6 (รอเซิร์ฟเวอร์)
port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
turn:
  enabled: true
  domain: ${TURN_DOMAIN}
  cert_file: ${TURN_CERT_FILE}
  key_file: ${TURN_KEY_FILE}
  tls_port: 5349
  udp_port: 3478
  external_tls: true
keys:
  # ใส่คู่ key/secret ผ่าน env LIVEKIT_KEYS ตอน docker compose up (ดู docker-compose.yml)
