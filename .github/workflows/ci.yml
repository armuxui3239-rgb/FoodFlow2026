name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code quality (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          for i in 1 2 3 4 5; do
            if curl -sSLf --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/gitleaks.tar.gz \
              https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz; then
              break
            fi
            echo "download attempt $i failed — รอ 10 วินาทีแล้วลองใหม่"
            sleep 10
            if [ "$i" = "5" ]; then echo "ขอเวอร์ชันผ่าน apt แทน (release CDN ล่มชั่วคราว)"; sudo apt-get update -qq && sudo apt-get install -y -qq gitleaks && cp "$(command -v gitleaks)" /tmp/gitleaks && break; fi
          done
          if [ -f /tmp/gitleaks.tar.gz ]; then
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp
            chmod +x /tmp/gitleaks
          fi
          /tmp/gitleaks version

      - name: Scan full history for leaked secrets
        run: /tmp/gitleaks detect --redact --exit-code 1 --log-opts="--all"
