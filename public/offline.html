<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ออฟไลน์ — ฟู๊ด ธันเดอร์</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff; color: #111; padding: 24px; text-align: center; }
      .card { max-width: 360px; }
      .badge { display: inline-flex; width: 64px; height: 64px; border-radius: 20px; background: #FFC400; align-items: center; justify-content: center; font-weight: 800; font-size: 24px; margin-bottom: 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; color: #666; margin: 0 0 20px; line-height: 1.5; }
      button { background: #FFC400; color: #111; border: 0; border-radius: 999px; padding: 12px 24px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">FT</div>
      <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
      <p>กรุณาตรวจสอบสัญญาณอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง</p>
      <button onclick="window.location.reload()">ลองใหม่</button>
    </div>
  </body>
</html>
